<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<title>Vocab Flashcards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Vocab<span>.</span></h1>
    <p class="subtitle">Oxford 3000 — Random 5</p>
  </header>

  <main id="board" class="board"></main>

  <footer class="controls">
    <button id="shuffleBtn" class="btn btn-primary">New 5 words</button>
    <button id="recallBtn" class="btn btn-secondary">Recall words</button>
    <p class="hint">Tap a card to flip it</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
